appId: com.project-guardian.app
productName: Project Guardian
copyright: Copyright © 2025 Project Guardian

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - "!node_modules"

extraResources:
  # Bundle the Next.js standalone server + static assets
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
  - from: .next/static
    to: standalone/.next/static
    filter:
      - "**/*"
  - from: public
    to: standalone/public
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  target:
    - target: zip
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
